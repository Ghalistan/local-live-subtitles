name: Build & Release

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  extension:
    name: Chrome Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        working-directory: extension
        run: bun install

      - name: Run extension tests
        working-directory: extension
        run: bun test

      - name: Typecheck extension
        working-directory: extension
        run: bun run compile

      - name: Package Chrome extension zip
        working-directory: extension
        run: bun run zip

      - name: Stage extension archive
        shell: bash
        run: |
          shopt -s nullglob
          VERSION=$(node -p "require('./extension/package.json').version")
          mkdir -p dist
          ZIPS=(extension/.output/*-chrome.zip)
          if [ ${#ZIPS[@]} -eq 0 ]; then
            echo "No Chrome extension zip found in extension/.output/"
            exit 1
          fi
          cp "${ZIPS[0]}" "dist/local-live-subtitles-extension-v${VERSION}-chrome.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: chrome-extension
          path: dist/*.zip
          if-no-files-found: error

  desktop-server:
    name: Desktop Server (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x86_64
            rustflags: '-C link-arg=-Wl,-rpath,$ORIGIN'
          - os: macos-15
            target: macos-arm64
            rustflags: '-C link-arg=-Wl,-rpath,@executable_path'
          - os: windows-latest
            target: windows-x86_64
            rustflags: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: matrix.target == 'linux-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake pkg-config libclang-dev libvulkan-dev glslc \
            libx11-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libgtk-3-dev libssl-dev libdbus-1-dev
          echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      - name: Resolve latest Vulkan SDK version (Windows)
        if: matrix.target == 'windows-x86_64'
        id: vulkan-ver
        shell: pwsh
        run: |
          $ver = (Invoke-RestMethod -Uri "https://vulkan.lunarg.com/sdk/latest/windows.txt").Trim()
          if (-not $ver) { throw "Failed to resolve latest Vulkan SDK version." }
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Cache Vulkan SDK (Windows)
        if: matrix.target == 'windows-x86_64'
        uses: actions/cache@v4
        with:
          path: C:\VulkanSDK
          key: windows-vulkan-sdk-${{ steps.vulkan-ver.outputs.version }}

      - name: Install Vulkan SDK (Windows)
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          $ver = "${{ steps.vulkan-ver.outputs.version }}"
          $findSdk = {
            if (Test-Path "C:\VulkanSDK\Include\vulkan\vulkan.h") { return "C:\VulkanSDK" }
            if (Test-Path "C:\VulkanSDK\$ver\Include\vulkan\vulkan.h") { return "C:\VulkanSDK\$ver" }
            return $null
          }
          $sdk = & $findSdk
          if (-not $sdk) {
            $installer = "$env:TEMP\vulkan_sdk.exe"
            Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkan_sdk.exe?Human=true" -OutFile $installer
            $proc = Start-Process -FilePath $installer -ArgumentList "--root C:\VulkanSDK --accept-licenses --default-answer --confirm-command install" -NoNewWindow -Wait -PassThru
            Remove-Item $installer -Force -ErrorAction SilentlyContinue
            if ($proc.ExitCode -ne 0) {
              throw "Vulkan SDK installer exited with code $($proc.ExitCode)."
            }
            $sdk = & $findSdk
          }
          if (-not $sdk) { throw "Vulkan headers not found under C:\VulkanSDK after installation." }
          if (-not (Test-Path "$sdk\Lib\vulkan-1.lib")) { throw "Missing $sdk\Lib\vulkan-1.lib" }
          if (-not (Test-Path "$sdk\Bin\glslc.exe")) { throw "Missing $sdk\Bin\glslc.exe" }
          "VULKAN_SDK=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$sdk\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Setup MSVC developer environment (Windows)
        if: matrix.target == 'windows-x86_64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure Windows build environment
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install -y ninja
          }
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_C_COMPILER=cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_CXX_COMPILER=cl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_DIR=D:\t" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path "C:\Program Files\LLVM\bin") {
            "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - uses: dtolnay/rust-toolchain@stable

      - if: matrix.target != 'windows-x86_64'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native -> target

      - if: matrix.target == 'windows-x86_64'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: native

      - name: Run native tests
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo test --release --manifest-path native/Cargo.toml

      - name: Build release binary
        env:
          RUSTFLAGS: ${{ matrix.rustflags }}
        run: cargo build --release --manifest-path native/Cargo.toml

      - name: Package desktop server (Unix)
        if: matrix.target != 'windows-x86_64'
        shell: bash
        run: |
          shopt -s nullglob
          VERSION=$(node -p "require('./extension/package.json').version")
          STAGE="dist/stage"
          mkdir -p "$STAGE"
          cp native/target/release/live-subtitles-native "$STAGE/"
          for lib in native/target/release/libonnxruntime*; do
            cp -P "$lib" "$STAGE/"
          done
          tar -C "$STAGE" -czf "dist/local-live-subtitles-server-v${VERSION}-${{ matrix.target }}.tar.gz" .
          rm -rf "$STAGE"

      - name: Package desktop server (Windows)
        if: matrix.target == 'windows-x86_64'
        shell: pwsh
        run: |
          $VERSION = node -p "require('./extension/package.json').version"
          $stage = "dist/stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "$env:CARGO_TARGET_DIR\release\live-subtitles-native.exe" "$stage/"
          Get-ChildItem "$env:CARGO_TARGET_DIR\release\onnxruntime*.dll" -ErrorAction SilentlyContinue | Copy-Item -Destination "$stage/"
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/local-live-subtitles-server-v${VERSION}-windows-x86_64.zip" -Force
          Remove-Item -Recurse -Force $stage

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-server-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [extension, desktop-server]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
